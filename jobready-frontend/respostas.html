<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobReady — Respostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" data-active="respostas"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Respostas</h1>
        <p>Respostas dadas pelos usuários durante as simulações.</p>
      </div>
      <button class="btn btn-primary" id="btn-novo">+ Novo</button>
    </div>

    <div class="alert" id="crud-alert" style="display:none;"></div>

    <table id="crud-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>ID da entrevista</th>
          <th>ID da pergunta</th>
          <th>Tipo</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">Nenhum registro cadastrado ainda.</div>

    <div class="modal-backdrop" id="crud-modal-backdrop">
      <div class="modal">
        <h2 id="crud-modal-title">Novo Resposta</h2>
        <form id="crud-form">
          <div class="field">
            <label>ID da entrevista</label>
            <input type="number" name="entrevista_id" required>
          </div>
          <div class="field">
            <label>ID da pergunta</label>
            <input type="number" name="pergunta_id" required>
          </div>
          <div class="field">
            <label>Resposta</label>
            <textarea name="texto_resposta" required></textarea>
          </div>
          <div class="field">
            <label>Tipo</label>
            <select name="tipo">
              <option value="texto">texto</option>
              <option value="voz">voz</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  resourcePath: "/api/respostas",
  singular: "Resposta",
  columns: [
    { key: "id", label: "ID" },
    { key: "entrevista_id", label: "ID da entrevista" },
    { key: "pergunta_id", label: "ID da pergunta" },
    { key: "tipo", label: "Tipo" }
  ],
  fields: [
    { name: "entrevista_id", type: "number" },
    { name: "pergunta_id", type: "number" },
    { name: "texto_resposta", type: "textarea" },
    { name: "tipo", type: "select" }
  ],
});
</script>
</body>
</html>
